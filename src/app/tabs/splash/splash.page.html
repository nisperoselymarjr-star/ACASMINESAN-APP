<ion-content [fullscreen]="true" class="splash-screen">
  <main class="splash" aria-label="Welcome to Komyunity">

    <section class="brand">
      <div class="logo-tile">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" aria-hidden="true" focusable="false">
          <path class="k-body" d="M 52,48 C 42,48 34,56 34,68 L 34,132 C 34,144 42,152 52,152 L 64,152 L 64,111 L 96,152 L 125,152 C 138,152 148,139 140,125 L 114,98 L 140,68 C 148,55 138,48 125,48 L 97,48 L 64,90 L 64,68 C 64,56 56,48 52,48 Z" />
          <ellipse class="k-eye" cx="49" cy="100" rx="6" ry="10" transform="rotate(-8 49 100)" />
          <ellipse class="k-eye" cx="108" cy="76" rx="6" ry="10" transform="rotate(15 108 76)" />
        </svg>
      </div>

      <h1 class="wordmark">Komyunity</h1>
      <p class="tagline">Your community, all in one place.</p>
    </section>

    <div class="actions">
      <button type="button" class="btn btn-secondary" routerLink="/create-account">Sign Up</button>
      <button type="button" class="btn btn-primary" routerLink="/tabs/login">Log In</button>
    </div>

  </main>
</ion-content>
